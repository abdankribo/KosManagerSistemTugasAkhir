name: Setup Production MySQL

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      SEED_ADMIN_USERNAME: ${{ secrets.SEED_ADMIN_USERNAME }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
      SEED_USER_USERNAME: ${{ secrets.SEED_USER_USERNAME }}
      SEED_USER_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate required secrets
        shell: bash
        run: |
          for name in DATABASE_URL SEED_ADMIN_USERNAME SEED_ADMIN_PASSWORD SEED_USER_USERNAME SEED_USER_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret is missing: $name"
              exit 1
            fi
          done

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Create or synchronize production schema
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: Seed production accounts
        run: npm run seed

      - name: Verify required room inventory
        run: |
          node --input-type=module <<'NODE'
          import { PrismaClient } from '@prisma/client';
          const db = new PrismaClient();
          try {
            const expected = [
              ['102', 1000000], ['103', 1000000], ['104', 1000000], ['105', 1000000], ['106', 1000000],
              ['107', 2000000], ['108', 2000000], ['109', 2000000], ['110', 2000000], ['111', 2000000],
            ];
            const rooms = await db.room.findMany({
              where: { number: { in: expected.map(([number]) => number) }, deletedAt: null },
              select: { number: true, costPerMonth: true },
              orderBy: { number: 'asc' },
            });
            const actual = rooms.map((room) => [room.number, Number(room.costPerMonth)]);
            const ok = expected.length === actual.length && expected.every(([number, price], i) => actual[i]?.[0] === number && actual[i]?.[1] === price);
            if (!ok) {
              console.error('Room inventory verification failed. Expected:', JSON.stringify(expected));
              console.error('Actual:', JSON.stringify(actual));
              process.exit(1);
            }
            console.log('Required room inventory OK:', JSON.stringify(actual));
          } finally {
            await db.$disconnect();
          }
          NODE
